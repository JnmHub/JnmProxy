server:
  api_addr: "127.0.0.1:8080"

proxy:
  http_addr: "127.0.0.1:1081"
  socks_addr: "127.0.0.1:1080"

database:
  path: "./data/jnmproxy.db"

subscription:
  default_user_agent: "clash/1.18.0"
  default_refresh_interval_seconds: 3600
  request_timeout_seconds: 20

stats:
  flush_interval_seconds: 10

scheduler:
  subscription_tick_seconds: 30
  health_check_interval_seconds: 300
  health_check_target: ""

sing_box:
  enabled: true
  version: "v1.13.8"
  mode: "auto" # auto | dialer | box
  prefer_native_http_socks: true
  max_active_engines: 64
  engine_idle_timeout_seconds: 600
  engine_start_timeout_seconds: 10
  engine_dial_timeout_seconds: 30
  log_level: "warn"
  health_check_target: "www.gstatic.com:443"
  enable_udp: false

security:
  redact_logs: true
